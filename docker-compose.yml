version: '3.8'

services:
  # Training service
  train:
    build:
      context: .
      target: training
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/train.py

  # Evaluation service
  evaluate:
    build:
      context: .
      target: inference
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - train
    command: python src/evaluate.py

  # API service (for future use)
  api:
    build:
      context: .
      target: base
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload

  # Streamlit UI (for future use)
  streamlit:
    build:
      context: .
      target: base
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
      - ./app.py:/app/app.py
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
